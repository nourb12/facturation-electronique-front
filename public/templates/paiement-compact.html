<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement Compact</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invoice {
            width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #10B981;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            color: #059669;
        }
        .invoice-info {
            text-align: right;
        }
        .invoice-title {
            font-size: 20px;
            font-weight: 900;
            color: #059669;
            margin-bottom: 5px;
        }
        .invoice-number {
            font-size: 12px;
            color: #666;
        }
        .status-badge {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .party {
            border: 1px solid #e0e0e0;
            padding: 12px;
            border-radius: 4px;
        }
        .party-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .party-name {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .party-details {
            font-size: 11px;
            color: #666;
            line-height: 1.5;
        }
        .payment-details {
            background: #ecfdf5;
            border: 2px solid #10B981;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .payment-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid #d1fae5;
        }
        .payment-row:last-child {
            border-bottom: none;
        }
        .payment-row.amount {
            font-size: 20px;
            font-weight: 900;
            color: #10B981;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #10B981;
        }
        .payment-label {
            color: #666;
            font-weight: 600;
        }
        .payment-value {
            font-weight: 700;
            color: #2c3e50;
        }
        .footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 9px;
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="invoice">
        <div class="header">
            <div class="logo">|||Birou</div>
            <div class="invoice-info">
                <div class="invoice-title">PAIEMENT</div>
                <div class="invoice-number">PAY-S-00001 | 12/05/2026</div>
            </div>
        </div>

        <div class="status-badge">
            ✓ Reçu
        </div>

        <div class="parties">
            <div class="party">
                <div class="party-title">De</div>
                <div class="party-name">Client ABC</div>
                <div class="party-details">
                    2000 Ariana, Tunisie
                </div>
            </div>

            <div class="party">
                <div class="party-title">À</div>
                <div class="party-name">Birou Suite</div>
                <div class="party-details">
                    La Marsa, Tunisie<br>
                    M.F.: 1729801/F
                </div>
            </div>
        </div>

        <div class="payment-details">
            <div class="payment-row">
                <span class="payment-label">Facture</span>
                <span class="payment-value">INV-2021-009</span>
            </div>
            <div class="payment-row">
                <span class="payment-label">Mode</span>
                <span class="payment-value">Virement bancaire</span>
            </div>
            <div class="payment-row">
                <span class="payment-label">Référence</span>
                <span class="payment-value">VIR-2026-05-12-ABC</span>
            </div>
            <div class="payment-row">
                <span class="payment-label">Date</span>
                <span class="payment-value">12 Mai 2026</span>
            </div>
            <div class="payment-row amount">
                <span>Montant</span>
                <span>1.382.200 TND</span>
            </div>
        </div>

        <div class="footer">
            Reçu généré automatiquement
        </div>
    </div>
</body>
</html>
