<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement Ticket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invoice {
            width: 80mm;
            background: white;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border: 2px dashed #ccc;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #ccc;
        }
        .logo {
            font-size: 20px;
            font-weight: 900;
            color: #000;
            margin-bottom: 8px;
        }
        .invoice-title {
            font-size: 16px;
            font-weight: 900;
            color: #000;
            margin-bottom: 5px;
        }
        .invoice-number {
            font-size: 10px;
            color: #666;
        }
        .status-badge {
            background: #e0e0e0;
            padding: 6px 10px;
            margin-bottom: 15px;
            font-size: 10px;
            text-align: center;
            font-weight: 700;
            border: 1px solid #999;
        }
        .party {
            margin-bottom: 15px;
            font-size: 10px;
            line-height: 1.5;
        }
        .party-title {
            font-weight: 700;
            margin-bottom: 5px;
        }
        .payment-details {
            border-top: 1px dashed #ccc;
            border-bottom: 1px dashed #ccc;
            padding: 10px 0;
            margin-bottom: 15px;
        }
        .payment-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 6px;
        }
        .payment-row.amount {
            font-size: 14px;
            font-weight: 900;
            border-top: 2px solid #000;
            padding-top: 8px;
            margin-top: 8px;
        }
        .footer {
            text-align: center;
            font-size: 8px;
            color: #999;
            border-top: 2px dashed #ccc;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="invoice">
        <div class="header">
            <div class="logo">|||Birou</div>
            <div class="invoice-title">REÇU</div>
            <div class="invoice-number">PAY-S-00001</div>
            <div class="invoice-number">12/05/2026</div>
        </div>

        <div class="status-badge">
            ✓ PAYÉ
        </div>

        <div class="party">
            <div class="party-title">DE:</div>
            Client ABC<br>
            2000 Ariana
        </div>

        <div class="party">
            <div class="party-title">À:</div>
            Birou Suite<br>
            La Marsa, Tunisie<br>
            M.F.: 1729801/F
        </div>

        <div class="payment-details">
            <div class="payment-row">
                <span>Facture:</span>
                <span>INV-2021-009</span>
            </div>
            <div class="payment-row">
                <span>Mode:</span>
                <span>Virement</span>
            </div>
            <div class="payment-row">
                <span>Réf:</span>
                <span>VIR-2026-05-12</span>
            </div>
            <div class="payment-row">
                <span>Date:</span>
                <span>12/05/2026</span>
            </div>
            <div class="payment-row amount">
                <span>MONTANT</span>
                <span>1.382.200 TND</span>
            </div>
        </div>

        <div class="footer">
            Reçu de paiement<br>
            Document non contractuel<br>
            Merci
        </div>
    </div>
</body>
</html>
